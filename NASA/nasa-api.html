<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JPL Star-Surfer Mobile</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; touch-action: none; }
        #hud {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            background: rgba(0, 20, 0, 0.6); border: 1px solid #0f0; padding: 10px; font-size: 10px;
        }
        /* Virtual Joysticks */
        .joystick-zone {
            position: absolute; bottom: 40px; width: 120px; height: 120px;
            background: rgba(0, 255, 0, 0.1); border: 2px dashed #0f0; border-radius: 50%;
            z-index: 200; display: flex; align-items: center; justify-content: center;
        }
        #left-joy { left: 30px; } /* Movement */
        #right-joy { right: 30px; } /* Steering */
        .knob { width: 40px; height: 40px; background: #0f0; border-radius: 50%; opacity: 0.5; }
        
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div id="hud">
    <strong>📡 MOBILE NAVO SCOUT</strong><br>
    STATUS: <span id="s-val">PILOTING</span><br>
    POS: <span id="c-val">0,0</span>
</div>

<div id="left-joy" class="joystick-zone"><div class="knob" id="l-knob"></div></div>
<div id="right-joy" class="joystick-zone"><div class="knob" id="r-knob"></div></div>

<script src="app.js"></script>
</body>
</html>
