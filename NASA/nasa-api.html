<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPL Starship Navigator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/FlyControls.js"></script>
    
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; }
        #view-container { position: relative; width: 100vw; height: 100vh; }
        
        /* Cockpit HUD */
        #hud {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(0, 40, 0, 0.7); border: 1px solid #0f0;
            padding: 15px; pointer-events: none; width: 250px;
        }
        #nav-menu {
            position: absolute; bottom: 20px; left: 20px; z-index: 100;
            background: rgba(0, 20, 0, 0.9); border: 1px solid #0f0;
            padding: 10px; width: 300px; max-height: 40vh; overflow-y: auto;
        }
        .nav-item { cursor: pointer; padding: 5px; border-bottom: 1px solid #030; font-size: 12px; }
        .nav-item:hover { background: #0f0; color: #000; }
        
        canvas { display: block; }
        .crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); color: #0f0;
            font-size: 24px; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="view-container">
    <div id="hud">
        <strong>🚀 SHIP STATUS</strong><hr>
        POS: <span id="hud-pos">0, 0, 0</span><br>
        SPEED: <span id="hud-speed">0.0</span> AU/s<br>
        TARGET: <span id="hud-target">None</span><br>
        <small style="color: #8f8;">W/S: Thrusters | A/D: Roll<br>Arrows: Pitch/Yaw</small>
    </div>

    <div class="crosshair">+</div>

    <div id="nav-menu">
        <strong>📡 JPL OBJECTS LOCATED</strong>
        <div id="object-list">Click "Sync" to load objects...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/gh/yanivdg/MoreApp@4ac819e79be4e47c69300b255bda62db89523c3a/NASA/app.js"></script>
</body>
</html>
