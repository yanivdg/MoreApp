                      <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JPL Star-Surfer: Enhanced Visibility</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
<script> if ('serviceWorker' in navigator) {  navigator.serviceWorker.register('sw.js');  }</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --glow: #00ffcc; }
        body { background: #000; color: var(--glow); font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; }
        #space-viewport { width: 100%; height: 65vh; position: relative; border-bottom: 2px solid var(--glow); }
        #data-section { height: 35vh; overflow-y: auto; padding: 15px; background: #000a05; position: relative; animation: flicker 0.2s infinite; }
        #data-section::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05)); background-size: 100% 2px, 3px 100%; pointer-events: none; }
        @keyframes flicker { 0% { opacity: 0.98; } 100% { opacity: 1; } }
        .joystick { position: absolute; bottom: 20px; width: 80px; height: 80px; background: rgba(0, 255, 204, 0.1); border: 2px solid var(--glow); border-radius: 50%; z-index: 1000; box-shadow: 0 0 20px var(--glow); }
        #move-joy { left: 20px; } #look-joy { right: 20px; }
        .knob { width: 30px; height: 30px; background: var(--glow); border-radius: 50%; box-shadow: 0 0 10px #fff; pointer-events: none; }
        .table-monitor { color: var(--glow); border-color: #003322; font-size: 11px; }
    </style>
</head>
<body>

<div id="space-viewport">
    <div id="move-joy" class="joystick"><div class="knob" id="m-knob"></div></div>
    <div id="look-joy" class="joystick"><div class="knob" id="l-knob"></div></div>
</div>

<div id="data-section">
    <div style="font-size: 12px; margin-bottom: 5px;">[ SENSOR FEED: NASA JPL-NAVO ]</div>
    <div id="sbdb_query-out"></div>
</div>

<script>
const app = {
    endpoint: "https://ssd-api.jpl.nasa.gov/sbdb_query.api?fields=full_name,a,e,q,i,om&sb-class=IEO",
    proxy: "https://corsproxy.io/?",
    input: { move: {x:0, y:0}, look: {x:0, y:0} },
    engine: { scene: null, camera: null, renderer: null, asteroids: [] },

    init() {
        this.setup3D();
        this.setupTouch();
        this.fetchData();
        this.animate();
    },

    setup3D() {
        const container = document.getElementById('space-viewport');
        this.engine.scene = new THREE.Scene();
        this.engine.scene.background = new THREE.Color(0x000505);

        this.engine.camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 10000);
        this.engine.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.engine.renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(this.engine.renderer.domElement);

        // SHIP LIGHT (Scanner)
        const shipLight = new THREE.SpotLight(0xffffff, 5);
        shipLight.position.set(0, 0, 1);
        this.engine.camera.add(shipLight);
        this.engine.scene.add(this.engine.camera);

        // AMBIENT GLOW
        this.engine.scene.add(new THREE.AmbientLight(0x222222));
        
        // STARFIELD
        const starGeo = new THREE.BufferGeometry();
        const stars = [];
        for(let i=0; i<8000; i++) stars.push((Math.random()-0.5)*5000, (Math.random()-0.5)*5000, (Math.random()-0.5)*5000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(stars, 3));
        this.engine.scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0x00ffcc, size: 2})));

        this.engine.camera.position.set(0, 10, 100);
    },

    setupTouch() {
        const handle = (id, key) => {
            const el = document.getElementById(id);
            const knob = document.getElementById(id[0] + '-knob');
            const touch = (e) => {
                e.preventDefault();
                const t = e.touches[0];
                const r = el.getBoundingClientRect();
                this.input[key] = { x: (t.clientX - (r.left + r.width/2)) / (r.width/2), y: (t.clientY - (r.top + r.height/2)) / (r.width/2) };
                knob.style.transform = `translate(${this.input[key].x * 20}px, ${this.input[key].y * 20}px)`;
            };
            el.addEventListener('touchstart', touch, {passive: false});
            el.addEventListener('touchmove', touch, {passive: false});
            el.addEventListener('touchend', () => { this.input[key] = {x:0, y:0}; knob.style.transform = 'translate(0,0)'; });
        };
        handle('move-joy', 'move'); handle('look-joy', 'look');
    },

    async fetchData() {
        try {
            const res = await fetch(this.proxy + encodeURIComponent(this.endpoint));
            const data = await res.json();
            this.renderTable(data);
            this.plotAsteroids(data);
        } catch (e) { console.error("Link error", e); }
    },

    plotAsteroids(data) {
        data.data.forEach((row, i) => {
            const a = parseFloat(row[1]);
            const geo = new THREE.DodecahedronGeometry(8, 0); // Much larger asteroids
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0x00ffcc, 
                wireframe: true,
                emissive: 0x00ffcc,
                emissiveIntensity: 0.5 
            });
            const mesh = new THREE.Mesh(geo, mat);
            const dist = a * 300;
            const angle = (i / data.data.length) * Math.PI * 2;
            mesh.position.set(Math.cos(angle)*dist, (Math.random()-0.5)*200, Math.sin(angle)*dist);
            this.engine.scene.add(mesh);
            this.engine.asteroids.push(mesh);
        });
    },

    renderTable(data) {
        let h = `<table class="table table-monitor"><thead><tr><th>Name</th><th>A</th><th>E</th><th>Q</th></tr></thead><tbody>`;
        data.data.slice(0, 12).forEach(r => h += `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`);
        document.getElementById('sbdb_query-out').innerHTML = h + "</tbody></table>";
    },

    animate() {
        requestAnimationFrame(() => this.animate());
        this.engine.camera.translateZ(this.input.move.y * -10);
        this.engine.camera.translateX(this.input.move.x * 10);
        this.engine.camera.rotation.y -= this.input.look.x * 0.05;
        this.engine.camera.rotation.x -= this.input.look.y * 0.05;
        this.engine.asteroids.forEach(a => a.rotation.y += 0.01);
        this.engine.renderer.render(this.engine.scene, this.engine.camera);
    }
};
window.onload = () => app.init();
</script>
</body>
</html>
