<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPL Mission Control v2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --nasa-blue: #0b3d91; --jpl-red: #d41f35; --dark-bg: #050b18; --card-bg: #111d35; --accent: #00d4ff; }
        body { background-color: var(--dark-bg); color: #e0e0e0; font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
        
        /* Sidebar Styling */
        .sidebar { background: var(--nasa-blue); height: 100vh; padding: 20px; position: sticky; top: 0; border-right: 2px solid var(--jpl-red); display: flex; flex-direction: column; }
        .nav-link { color: #bccadb; cursor: pointer; padding: 12px; display: block; text-decoration: none; border-left: 3px solid transparent; transition: 0.2s; font-weight: 500; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.1); border-left: 3px solid var(--accent); color: white; }
        
        /* Dashboard Components */
        .card { background: var(--card-bg); border: 1px solid #1a5abf; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .data-scroll { height: calc(100vh - 180px); overflow-y: auto; border-radius: 8px; border: 1px solid #1a5abf; background: #000; }
        
        /* Table Aesthetics */
        .table-jpl { font-size: 0.85rem; margin-bottom: 0; }
        .table-jpl thead { position: sticky; top: 0; background: var(--nasa-blue); color: var(--accent); z-index: 10; border-bottom: 2px solid var(--jpl-red); }
        .table-dark { background-color: transparent; }
        
        /* Status Bar */
        .status-msg { font-size: 0.75rem; padding: 10px; border-radius: 4px; margin-top: auto; border: 1px solid #333; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 sidebar">
            <h4 class="text-center mb-4 text-white">JPL SYSTEMS</h4>
            
            <div class="mb-4">
                <label class="small text-white-50 text-uppercase fw-bold">NASA API Key</label>
                <input type="password" id="user-api-key" class="form-control form-control-sm bg-dark text-white border-secondary mt-1" placeholder="Paste key here...">
                <div class="x-small text-white-50 mt-1" style="font-size: 0.65rem;">Default: DEMO_KEY</div>
            </div>

            <div class="nav flex-column mb-auto" id="main-nav">
                <a class="nav-link active" data-section="cad">📡 Close Approaches</a>
                <a class="nav-link" data-section="mdesign">🛠️ Mission Design</a>
                <a class="nav-link" data-section="sentry">🛡️ Sentry Risk</a>
                <a class="nav-link" data-section="time">🕒 Time Converter</a>
            </div>

            <div id="api-status" class="status-msg bg-dark text-warning text-center">
                System Initializing...
            </div>
        </nav>

        <main class="col-md-9 col-lg-10 p-4">
            
            <section id="section-cad" class="content-section">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="text-info">Close Approach Data (CAD)</h3>
                    <button class="btn btn-sm btn-outline-info" onclick="app.refresh('cad')">Manual Refresh</button>
                </div>
                <div class="data-scroll" id="cad-out"></div>
            </section>

            <section id="section-mdesign" class="content-section d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="text-info">NEO Mission Design Opportunities</h3>
                    <button class="btn btn-sm btn-outline-info" onclick="app.refresh('mdesign')">Re-scan Targets</button>
                </div>
                <div class="data-scroll" id="mdesign-out"></div>
            </section>

            <section id="section-sentry" class="content-section d-none">
                <h3 class="text-danger">Sentry Earth Impact Monitoring</h3>
                <div class="data-scroll mt-3" id="sentry-out"></div>
            </section>

            <section id="section-time" class="content-section d-none">
                <h3 class="text-warning">Precise Time Converter</h3>
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="card p-4">
                            <label class="small text-info text-uppercase">Calendar to Julian Day</label>
                            <input type="text" id="cd-input" class="form-control bg-dark text-white my-3" value="2026-04-26 21:38">
                            <button class="btn btn-outline-primary" onclick="app.convertTime('toJD')">Generate JD</button>
                            <div id="jd-res" class="h3 mt-3 text-warning text-center"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card p-4">
                            <label class="small text-info text-uppercase">Julian Day to Calendar</label>
                            <input type="text" id="jd-input" class="form-control bg-dark text-white my-3" value="2461157.39">
                            <button class="btn btn-outline-primary" onclick="app.convertTime('fromDate')">Generate Date</button>
                            <div id="cd-res" class="h4 mt-3 text-info text-center"></div>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
