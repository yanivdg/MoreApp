<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JPL Star-Surfer: Deep Space Navigation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/FlyControls.js"></script>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
        #hud {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(0, 20, 0, 0.7); border: 1px solid #0f0;
            padding: 15px; pointer-events: none;
        }
        #mission-control {
            position: absolute; bottom: 20px; right: 20px; z-index: 100;
            background: rgba(0, 10, 0, 0.8); border: 1px solid #0f0;
            padding: 10px; width: 300px; max-height: 200px; overflow-y: auto; font-size: 10px;
        }
        .crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #0f0; font-size: 30px; pointer-events: none; opacity: 0.5;
        }
    </style>
</head>
<body>

<div id="hud">
    <strong>👨‍🚀 SURFER HUD</strong><hr>
    VELOCITY: <span id="v-val">0.0</span> AU/h<br>
    COORD: <span id="c-val">0, 0, 0</span><br>
    STATUS: <span id="s-val" style="color: #0ff;">SEARCHING FOR IEOs...</span>
</div>

<div class="crosshair">+</div>

<div id="mission-control">
    <strong>📡 INCOMING JPL DATA STRINGS</strong><hr>
    <div id="data-log">Initializing secure link to NASA...</div>
</div>

<script src="https://cdn.jsdelivr.net/gh/yanivdg/MoreApp@16e2ff20e3af244ebb0d7e0ffba86a6478f329b1/NASA/app.js"></script>
</body>
</html>
