name: Build NASA Space APK
on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup ImageMagick (For Icon Cropping)
        # We need this tool to handle the image manipulation safely in the cloud
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Prepare Web Assets
        run: |
          cd NASA
          mkdir -p www
          cp index.html app.js sw.js manifest.json api-config.js www/ || true
          cp "manifest json" www/manifest.json || true
          # We need a copy of the icon in the working directory for the next step
          cp icon.png www/icon.png || true

      - name: Generate Android App Icons
        # This uses cordova-res to auto-crop, auto-size, and auto-place your icons
        run: |
          cd NASA
          npx cordova-res --icon src:icon.png --platform android
          # The icons are now generated in NASA/resources/android/icon

      - name: Install Dependencies
        run: |
          cd NASA
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Android Project
        run: |
          cd NASA
          rm -rf android
          npx cap add android
          
          # CRITICAL STEP: Copy the generated icons from resources into the native project
          mkdir -p android/app/src/main/res
          cp -r resources/android/icon/* android/app/src/main/res/
          
          npx cap copy android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd NASA/android && ./gradlew assembleDebug

      - name: Upload nasa-space.apk
        uses: actions/upload-artifact@v4
        with:
          name: nasa-space-apk
          path: NASA/android/app/build/outputs/apk/debug/app-debug.apk
