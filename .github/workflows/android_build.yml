name: Build Android APK
on: 
  push:
    branches:
      - main  # Adjust this if your default branch is named differently

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
      - name: Build Android Project
        # This part enters your NASA folder to run the build
        run: |
          cd NASA
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd NASA/android && ./gradlew assembleDebug

      - name: Rename and Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: nasa-space-apk
          path: NASA/android/app/build/outputs/apk/debug/app-debug.apk
