name: Build NASA Space APK
on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        # FIXED: This ensures the Java compiler is ready for Capacitor
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Web Assets
        run: |
          cd NASA
          mkdir -p www
          cp index.html app.js sw.js manifest.json api-config.js www/ || true
          cp "manifest json" www/manifest.json || true

      - name: Install Dependencies
        run: |
          cd NASA
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Android Project
        run: |
          cd NASA
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd NASA/android && ./gradlew assembleDebug

      - name: Upload nasa-space.apk
        uses: actions/upload-artifact@v4
        with:
          name: nasa-space-apk
          path: NASA/android/app/build/outputs/apk/debug/app-debug.apk
