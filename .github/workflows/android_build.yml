name: Build NASA Space APK
on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Prepare Web Assets
        run: |
          cd NASA
          mkdir -p www
          # Check for the icon and STOP if missing
          if [ ! -f "icon.png" ]; then
            echo "❌ ERROR: icon.png is missing from the NASA folder!"
            exit 1
          fi
          cp index.html app.js sw.js manifest.json api-config.js icon.png www/ || true
          cp "manifest json" www/manifest.json || true

      - name: Install Dependencies
        run: |
          cd NASA
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Android Project
        run: |
          cd NASA
          rm -rf android
          npx cap add android

      - name: Generate and Inject App Icons
        run: |
          cd NASA
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          # This will only run if icon.png was found
          magick icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          magick icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          magick icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          magick icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          magick icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          find android/app/src/main/res -name "ic_launcher.png" -execdir cp {} ic_launcher_round.png \;

      - name: Fix Adaptive Icons
        run: |
          RES_DIR="NASA/android/app/src/main/res/mipmap-anydpi-v26"
          mkdir -p $RES_DIR
          echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@android:color/black"/><foreground android:drawable="@mipmap/ic_launcher"/></adaptive-icon>' > $RES_DIR/ic_launcher.xml
          cp $RES_DIR/ic_launcher.xml $RES_DIR/ic_launcher_round.xml

      - name: Final Sync and Build
        run: |
          cd NASA
          npx cap sync android
          cd android && ./gradlew assembleDebug

      - name: Upload nasa-space.apk
        uses: actions/upload-artifact@v4
        with:
          name: nasa-space-apk
          path: "**/app-debug.apk"
