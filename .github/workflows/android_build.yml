name: Build NASA Space APK
on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Web Assets
        # This creates the 'www' folder Capacitor is looking for
        run: |
          cd NASA
          mkdir www
          cp index.html app.js sw.js manifest.json www/
          # If you have other .js files like api-config.js, add them here:
          cp api-config.js www/ || true 

      - name: Install Dependencies
        run: |
          cd NASA
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Android Project
        run: |
          cd NASA
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd NASA/android && ./gradlew assembleDebug

      - name: Upload nasa-space.apk
        uses: actions/upload-artifact@v4
        with:
          name: nasa-space-apk
          path: NASA/android/app/build/outputs/apk/debug/app-debug.apk
